<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover"/>
<meta name="theme-color" content="#f3f3f7"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="PIN Podsjetnik"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png" type="image/png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<title>PIN Podsjetnik</title>
<style>
/* ── Palette ──────────────────────────────────────────────────────────────
   Every colour is defined once on bare :root (light). The dark blocks only
   redefine the same tokens, so no component ever hardcodes a colour and the
   two themes can't drift apart. */
:root{
  --bg:#f3f3f7; --surface:#ffffff; --surface-2:#eef0f4; --surface-3:#e4e4ea;
  --border:#e4e4ea; --border-soft:#ececf2;
  --text:#1c1c22; --text-dim:#6e6e77; --text-faint:#9a9aa4; --text-ghost:#c7c7d1;
  --accent:#e24b4a; --accent-ink:#ffffff; --accent-soft:rgba(226,75,74,.08); --accent-line:rgba(226,75,74,.35);
  --accent-glow:rgba(226,75,74,.28);
  --ok:#2f8f5b;
  --sh-1:0 1px 2px rgba(28,28,40,.04);
  --sh-2:0 1px 2px rgba(28,28,40,.03),0 6px 16px rgba(28,28,40,.05);
  --sh-3:0 -4px 16px rgba(28,28,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121216; --surface:#1b1b21; --surface-2:#24242c; --surface-3:#2e2e38;
    --border:#30303a; --border-soft:#27272f;
    --text:#f0f0f4; --text-dim:#a2a2ae; --text-faint:#76767f; --text-ghost:#4b4b56;
    --accent:#f0605e; --accent-ink:#1a0f0f; --accent-soft:rgba(240,96,94,.12); --accent-line:rgba(240,96,94,.4);
    --accent-glow:rgba(240,96,94,.22);
    --ok:#5cc182;
    --sh-1:0 1px 2px rgba(0,0,0,.3);
    --sh-2:0 1px 2px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.3);
    --sh-3:0 -4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121216; --surface:#1b1b21; --surface-2:#24242c; --surface-3:#2e2e38;
  --border:#30303a; --border-soft:#27272f;
  --text:#f0f0f4; --text-dim:#a2a2ae; --text-faint:#76767f; --text-ghost:#4b4b56;
  --accent:#f0605e; --accent-ink:#1a0f0f; --accent-soft:rgba(240,96,94,.12); --accent-line:rgba(240,96,94,.4);
  --accent-glow:rgba(240,96,94,.22);
  --ok:#5cc182;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 1px 2px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.3);
  --sh-3:0 -4px 16px rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* Layout */
.page{display:flex;flex-direction:column;min-height:100vh;max-width:430px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.page-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;max-width:430px;margin:0 auto;padding:0 24px calc(40px + env(safe-area-inset-bottom))}

/* Header */
.header{display:flex;align-items:center;gap:12px;padding:calc(24px + env(safe-area-inset-top)) 0 18px;border-bottom:1px solid var(--border);margin-bottom:22px}
.header-icon{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px var(--accent-glow)}
.header-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.header-sub{font-size:11px;color:var(--accent);margin-top:2px;letter-spacing:.5px}
.header-version{margin-left:auto;flex-shrink:0;font-size:11px;color:var(--text-faint);font-weight:700;letter-spacing:.5px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 8px;align-self:flex-start;box-shadow:var(--sh-1);cursor:default}
.header-version.stale{color:var(--accent);border-color:var(--accent);cursor:pointer}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--sh-2)}
.card-title{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--text-dim);text-transform:uppercase;margin-bottom:14px}

/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
.field input,.field select,.inp{width:100%;padding:11px 13px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input::placeholder,.inp::placeholder{color:var(--text-ghost)}
.field-hint{font-size:11px;color:var(--text-faint);line-height:1.5;margin-top:-8px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Day picker */
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.daypick-btn{padding:9px 0;border:1px solid var(--border);background:var(--surface-2);border-radius:7px;font-size:11px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:all .12s}
.daypick-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 2px 6px var(--accent-glow)}

/* Buttons */
.btn-red{width:100%;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:opacity .15s,transform .1s;box-shadow:0 4px 12px var(--accent-glow)}
.btn-red:active{opacity:.85;transform:scale(.98)}
.btn-red:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn-ghost{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--text-dim);margin-top:10px}
.btn-ghost:active{background:var(--surface-2)}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px;background:var(--surface)}
.tab{flex:1 1 20%;padding:11px 2px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--text-faint);position:relative;transition:all .15s;white-space:nowrap}
.tab.active{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 8px var(--accent-glow)}
.tab-badge{position:absolute;top:5px;right:6px;background:var(--surface);color:var(--accent);font-size:10px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}

/* PIN */
.pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:28px}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);transition:all .15s}
.dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.1)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;width:100%;margin:0 auto}
.pkey{height:65px;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:22px;font-weight:700;cursor:pointer;color:var(--text);transition:background .1s;box-shadow:var(--sh-1)}
.pkey:active{background:var(--surface-3)}
.pkey-del{font-size:14px;color:var(--text-faint)}
.pkey-empty{visibility:hidden}

/* Error */
.err{font-size:13px;color:var(--accent);text-align:center;min-height:20px;margin-bottom:12px}

/* Reminder item */
.ri{display:flex;align-items:flex-start;gap:11px;padding:13px;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;margin-bottom:9px;box-shadow:var(--sh-1)}
.ri-tap{cursor:pointer;flex:1;min-width:0;display:flex;align-items:flex-start;gap:11px}
.ri-tap:active{opacity:.65}
.ri-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px}
.ri-dot.done{background:var(--text-ghost)}
.ri-body{flex:1;min-width:0}
.ri-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.ri-name.done{color:var(--text-faint);text-decoration:line-through}
.ri-meta{font-size:12px;color:var(--text-faint)}
.ri-note{font-size:12px;color:var(--text-faint);margin-top:3px}
.ri-next{font-size:11px;color:var(--accent);margin-top:3px;font-weight:600}
.ri-del{background:none;border:none;cursor:pointer;color:var(--text-faint);font-size:20px;line-height:1;padding:2px 5px;flex-shrink:0;transition:color .15s}
.ri-del:active{color:var(--accent)}

/* Empty */
.empty{text-align:center;padding:50px 0;color:var(--text-ghost)}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.35}
.empty p{font-size:14px;line-height:1.7;color:var(--text-faint)}

/* Alarm screen */
.alarm-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:calc(32px + env(safe-area-inset-top)) 20px calc(48px + env(safe-area-inset-bottom));background:var(--bg)}
.alarm-ring{width:86px;height:86px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.alarm-badge{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:20px;padding:5px 12px;margin-bottom:14px;text-align:center;line-height:1.5}
.alarm-queue{font-size:11px;color:var(--text-faint);margin-top:14px}

/* Banner */
.banner{border-radius:8px;padding:11px 13px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px}
.banner-warn{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--text)}
.banner p{flex:1;line-height:1.5}
.banner button{border:none;font-size:12px;font-weight:700;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;flex-shrink:0;background:var(--accent);color:var(--accent-ink)}

/* Settings rows */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border-soft)}
.srow:last-child{border-bottom:none}
.srow-label{font-size:14px;font-weight:700}
.srow-sub{font-size:12px;color:var(--text-faint);margin-top:2px;line-height:1.5}
.srow button{font-size:13px;color:var(--accent);font-weight:700;background:none;border:none;cursor:pointer;padding:2px 0;flex-shrink:0}

/* Segmented control */
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{padding:7px 12px;font-size:12px;font-weight:700;border:none;background:var(--surface-2);color:var(--text-dim);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* Install prompt */
.install-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:100;max-width:430px;margin:0 auto;box-shadow:var(--sh-3)}
.install-bar-icon{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.install-bar-icon img{width:100%;height:100%;border-radius:10px}
.install-bar-text{flex:1;min-width:0}
.install-bar-text strong{display:block;font-size:13px;font-weight:700}
.install-bar-text span{font-size:11px;color:var(--text-faint)}
.install-bar-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.install-bar-close{background:none;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1}

/* Notes / Categories */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.cat-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:14px;cursor:pointer;position:relative;box-shadow:var(--sh-1)}
.cat-card-name{font-size:14px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
.cat-card-count{font-size:12px;color:var(--text-faint)}
.cat-bar{height:3px;border-radius:2px;background:var(--surface-3);margin-top:9px;overflow:hidden}
.cat-bar span{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .25s}
.cat-card-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text-faint);font-size:16px;cursor:pointer;padding:2px 6px;line-height:1}
.cat-card-del:active{color:var(--accent)}
.cat-back{display:flex;align-items:center;gap:6px;margin-bottom:16px;cursor:pointer;color:var(--text-dim);font-size:13px;font-weight:700;background:none;border:none;padding:4px 0}
.cat-item{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;margin-bottom:9px;box-shadow:var(--sh-1)}
.cat-item-check{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:none}
.cat-item-check.done{background:var(--accent);border-color:var(--accent)}
.cat-item-text{flex:1;font-size:14px;word-break:break-word}
.cat-item-text.done{color:var(--text-faint);text-decoration:line-through}
.add-inline{display:flex;gap:8px;margin-bottom:16px}
.add-inline input{flex:1;padding:11px 13px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;outline:none}
.add-inline input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.add-inline button{flex-shrink:0;padding:0 18px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:20px;line-height:1;box-shadow:0 2px 8px var(--accent-glow)}
.add-inline button:disabled{opacity:.35}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer;flex-shrink:0;box-shadow:var(--sh-1)}
.cal-nav-label{font-size:15px;font-weight:700;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px}
.cal-dow{text-align:center;font-size:10px;color:var(--text-faint);font-weight:700;padding-bottom:6px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;position:relative;color:var(--text);background:var(--surface);border:1px solid transparent}
.cal-day.other{color:var(--text-ghost);background:transparent}
.cal-day.today{border-color:var(--accent)}
.cal-day.selected{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 2px 8px var(--accent-glow)}
.cal-day-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);position:absolute;bottom:5px}
.cal-day.selected .cal-day-dot{background:var(--accent-ink)}
.cal-events-title{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--text-dim);text-transform:uppercase;margin-bottom:12px}
.ev-time{font-size:12px;color:var(--accent);font-weight:700;flex-shrink:0;min-width:42px;margin-top:2px}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;line-height:1.45}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
// Bump on every deploy — shown in the header so it's obvious (without opening
// devtools) whether a device is actually running the latest build, and must
// match sw.js's CACHE string so a stale service worker is easy to spot too.
var APP_VERSION = 'v15';

// ── Push server config ───────────────────────────────────────────────────
// Empty = feature disabled, app behaves exactly as before (local-only
// scheduling). Fill in after deploying worker/ (see worker/README.md) —
// PUSH_SERVER_URL also needs to match the same constant in sw.js.
var PUSH_SERVER_URL = '';
var VAPID_PUBLIC_KEY = '';

// Matches MISSED_ALARM_WINDOW_MS in sw.js: how far past its time an alarm can
// still be caught up rather than silently skipped.
var MISSED_WINDOW_MS = 24 * 60 * 60 * 1000;

// ── Globals ───────────────────────────────────────────────────────────────
var APP = {
  pin: '',
  view: 'main',   // setup | main
  tab: 'add',     // add | list | notes | calendar | settings
  alarm: null,        // currently displayed alarm
  alarmQueue: [],     // alarms waiting their turn (or waiting for the app to be visible)
  setupStep: 'set',
  sp: '', sc: '', serr: '',
  pinInput: '', perr: '',
  addTitle: '', addNote: '', addTime: '', addRepeat: 'daily', addDays: [1,2,3,4,5],
  editId: null,       // id being edited, or null when adding
  listQuery: '',
  notifPerm: ('Notification' in window) ? Notification.permission : 'unsupported',
  notifMsg: '',
  notifAsked: false,
  swReg: null,
  swUpdateAvailable: false,
  installPrompt: null,
  installDismissed: false,
  // Notes / categories
  notesCat: null,
  newCatName: '',
  newItemText: '',
  // Calendar
  calYear: new Date().getFullYear(),
  calMonthIdx: new Date().getMonth(),
  calSelDate: '',
  calAddTitle: '', calAddTime: '', calAddNote: '', calEditId: null
};

// ── Storage ───────────────────────────────────────────────────────────────
function lsGet(k, d) {
  try { var v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : d; }
  catch(e) { return d; }
}
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch(e) {} }
function lsClear() { try { localStorage.clear(); } catch(e) {} }
function getRems() { return lsGet('reminders', []); }
function saveRems(r) { lsSet('reminders', r); }
function getCats() { return lsGet('note_categories', []); }
function saveCats(c) { lsSet('note_categories', c); }
function getEvents() { return lsGet('cal_events', []); }
function saveEvents(e) { lsSet('cal_events', e); }
function getSettings() {
  var s = lsGet('settings', {});
  return { theme: s.theme || 'auto', snooze: s.snooze || 10 };
}
function saveSettings(s) { lsSet('settings', s); }

// ── Theme ─────────────────────────────────────────────────────────────────
function isDarkNow() {
  var t = getSettings().theme;
  if (t === 'dark') return true;
  if (t === 'light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme() {
  var t = getSettings().theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', isDarkNow() ? '#121216' : '#f3f3f7');
}
if (window.matchMedia) {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onScheme = function(){ if (getSettings().theme === 'auto') applyTheme(); };
  if (mq.addEventListener) mq.addEventListener('change', onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}

// ── Toast ─────────────────────────────────────────────────────────────────
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2600);
}

// ── Repeat logic ──────────────────────────────────────────────────────────
// Byte-for-byte identical to repeatDays()/computeNextFire() in sw.js. The two
// schedule independently (SW timer vs. the in-page fallback below) and must
// agree on the exact instant, or a repeating alarm fires twice a day apart.
function repeatDays(repeat, days) {
  if (repeat === 'weekdays') return [1,2,3,4,5];
  if (repeat === 'custom') return (days && days.length) ? days : [0,1,2,3,4,5,6];
  return null; // once | daily → any day of the week is fine
}
function computeNextFire(time, repeat, days, from) {
  var base = new Date(from || Date.now());
  var p = String(time).split(':');
  var fire = new Date(base);
  fire.setHours(+p[0], +p[1], 0, 0);
  if (fire.getTime() <= base.getTime()) fire.setDate(fire.getDate() + 1);
  var allowed = repeatDays(repeat, days);
  if (allowed) {
    var guard = 0;
    while (allowed.indexOf(fire.getDay()) === -1 && guard++ < 14) fire.setDate(fire.getDate() + 1);
  }
  return fire.getTime();
}

// ── Notification permission ───────────────────────────────────────────────
function isIOS() {

         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isStandalone() {

         window.navigator.standalone === true;
}
function isAndroid() { return /Android/.test(navigator.userAgent); }

// the browser tab can't work — say so instead of failing silently.
function notifNeedsInstall() { return isIOS() && !isStandalone(); }

// A denied permission can never be re-requested by script — the user has to
// flip it in system/browser settings, so spell out where.
function notifUnblockSteps() {
  if (isAndroid() && isStandalone()) {
    return ['Drži prst na ikoni aplikacije → App info (ⓘ)',
            'Otvori Notifications / Obavijesti',
            'Uključi "All notifications"',
            'Vrati se u app — status se osvježi sam'];
  }
  if (isAndroid()) {
    return ['U Chromeu dodirni ikonu lijevo od adrese (🔒 ili ⚙)',
            'Permissions → Notifications → Allow',
            'Ili: Chrome ⋮ → Settings → Site settings → Notifications',
            'Vrati se u app — status se osvježi sam'];
  }
  if (isIOS()) {
    return ['iPhone Settings → Notifications',
            'Nađi "PIN Podsjetnik" na listi',
            'Uključi Allow Notifications',
            'Vrati se u app — status se osvježi sam'];
  }
  return ['Dodirni ikonu lijevo od adrese u pregledniku',
          'Notifications → Allow / Dozvoli',
          'Vrati se u app — status se osvježi sam'];
}

// The user fixes the permission outside the app, so re-read it on return
// instead of leaving a stale "Blokirano" on screen.
function refreshNotifPerm() {
  if (!('Notification' in window)) return;
  var now = Notification.permission;
  if (now !== APP.notifPerm) {
    APP.notifPerm = now;
    APP.notifMsg = now === 'granted' ? 'Notifikacije su dozvoljene ✓' : '';
    if (now === 'granted') subscribeToPush();
    render();
  }
}
window.addEventListener('focus', refreshNotifPerm);

function markNotifAsked() { APP.notifAsked = true; lsSet('notif_asked', true); }

// ── Push server sync (optional — no-op until worker/ is deployed and the
// PUSH_SERVER_URL/VAPID_PUBLIC_KEY constants above are filled in) ─────────
function getDeviceId() {
  var id = lsGet('device_id', null);
  if (!id) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('dev-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    lsSet('device_id', id);
  }
  return id;
}
function urlBase64ToUint8Array(base64String) {
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var rawData = atob(base64);
  var out = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; i++) out[i] = rawData.charCodeAt(i);
  return out;
}
function subscribeToPush() {
  if (!PUSH_SERVER_URL || !VAPID_PUBLIC_KEY || !navigator.serviceWorker) return;
  navigator.serviceWorker.ready.then(function(reg) {
    return reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }).then(function(sub) {
    var raw = sub.toJSON();
    return fetch(PUSH_SERVER_URL + '/api/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ deviceId: getDeviceId(), endpoint: raw.endpoint, keys: raw.keys })
    });
  }).catch(function(e) { console.warn('Push subscribe failed:', e); });
}
function localTimezone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) { return ''; }
}
function syncScheduleToServer(id, title, note, fireAt, repeat, days, time) {
  if (!PUSH_SERVER_URL) return;
  fetch(PUSH_SERVER_URL + '/api/schedule', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ deviceId: getDeviceId(), id: id, title: title, note: note, fireAt: fireAt,
                           repeat: repeat || 'once', days: days || null,
                           // time + zone let the server recompute repeats in the user's
                           // local clock instead of UTC — see worker/src/index.js
                           time: time || null, tz: localTimezone() })
  }).catch(function(){});
}
function syncCancelToServer(id) {
  if (!PUSH_SERVER_URL) return;
  fetch(PUSH_SERVER_URL + '/api/cancel', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id })
  }).catch(function(){});
}
function syncCancelAllToServer() {
  if (!PUSH_SERVER_URL) return;
  var body = new Blob([JSON.stringify({ deviceId: getDeviceId() })], { type: 'application/json' });
  // Called right before location.reload() — sendBeacon (not fetch) guarantees
  // the request is actually dispatched even as the page starts unloading.
  if (navigator.sendBeacon) navigator.sendBeacon(PUSH_SERVER_URL + '/api/cancel-all', body);
  else fetch(PUSH_SERVER_URL + '/api/cancel-all', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body }).catch(function(){});
}

function requestNotifPerm() {
  markNotifAsked();
  if (!('Notification' in window) || typeof Notification.requestPermission !== 'function') {
    APP.notifPerm = 'unsupported';
    APP.notifMsg = notifNeedsInstall()
      ? 'Na iPhoneu prvo dodaj app na početni ekran (Podijeli → Add to Home Screen), pa dozvoli notifikacije iz aplikacije.'
      : 'Ovaj preglednik ne podržava notifikacije.';
    render();
    return;
  }
  var settled = false;
  function done(p) {
    if (settled) return;   // some browsers fire both the callback and the promise
    settled = true;
    APP.notifPerm = p || Notification.permission;
    APP.notifMsg =
      APP.notifPerm === 'granted' ? 'Notifikacije su dozvoljene ✓' :
      APP.notifPerm === 'denied'  ? 'Notifikacije su blokirane. Uključi ih ručno u postavkama preglednika ili aplikacije.' :
                                    'Dozvola nije data. Klikni ponovo i potvrdi u prozoru preglednika.';
    if (APP.notifPerm === 'granted') subscribeToPush();
    render();
  }
  function fail(e) {
    if (settled) return;
    settled = true;
    APP.notifPerm = ('Notification' in window) ? Notification.permission : 'unsupported';
    APP.notifMsg = notifNeedsInstall()
      ? 'Na iPhoneu prvo dodaj app na početni ekran (Podijeli → Add to Home Screen), pa dozvoli notifikacije iz aplikacije.'
      : 'Preglednik je odbio zahtjev za notifikacije. Provjeri postavke stranice.';
    render();
  }
  try {
    // Safari < 16 uses the legacy callback form and returns undefined
    var r = Notification.requestPermission(done);
    if (r && typeof r.then === 'function') r.then(done)['catch'](fail);
  } catch(e) { fail(e); }
}

// ── Service Worker ────────────────────────────────────────────────────────
// Message listener at top level — never misses messages regardless of timing
if (navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'ALARM') triggerAlarm(e.data);
    if (e.data.type === 'SNOOZED') toast('Odgođeno ' + e.data.minutes + ' min');
  });
}
function applySWUpdate() { location.reload(); }

function initSW() {
  if (!navigator.serviceWorker) return;
  // Only a change from an *existing* controller counts as "new version took
  // over" — the very first activation also fires controllerchange (null →
  // worker) and that's not an update, just the app starting for the first time.
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (hadController) { APP.swUpdateAvailable = true; render(); }
    hadController = true;
  });
  navigator.serviceWorker.register('sw.js').then(function(reg) {
    APP.swReg = reg;
    reg.update().catch(function(){}); // force an immediate check, don't wait for the browser's own timer
    // One extra chance for the OS to wake the worker and notice a missed
    // alarm without the app being opened. Unsupported almost everywhere
    // except Chrome/Android installed PWAs — hence the bare catch.
    if (reg.periodicSync) {
      reg.periodicSync.register('alarm-check', { minInterval: 15 * 60 * 1000 }).catch(function(){});
    }
  }).catch(function(e) { console.warn('SW:', e); });
}
function swPost(data) {
  var c = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (c) c.postMessage(data);
  else if (APP.swReg && APP.swReg.active) APP.swReg.active.postMessage(data);
}

// announce=true shows an immediate "added" notification in the tray — only
// pass it from the user's own Add action, never from the bulk re-schedule on
// app load/dismiss, or every existing reminder would re-fire it on refresh.
function scheduleRem(r, announce) {
  var fireAt = r.nextFire;
  var now = Date.now();
  // Keep a fire time that's already past but still inside the catch-up window
  // so the fallback loop below can ring it late instead of losing it.
  if (!fireAt || (fireAt <= now && now - fireAt > MISSED_WINDOW_MS)) {
    fireAt = computeNextFire(r.time, r.repeat, r.days, now);
    persistNextFire(r.id, fireAt);
  }
  var msg = { type:'SCHEDULE', id:r.id, title:r.title, note:r.note, time:r.time,
              fireAt:fireAt, repeat:r.repeat, days:r.days || null,
              snooze:getSettings().snooze };
  if (announce) msg.confirmLabel = r.title + ' — ' + fmtTime(r.time) + ' · ' + rl(r.repeat, r.days);
  swPost(msg);
  syncScheduleToServer(r.id, r.title, r.note, fireAt, r.repeat, r.days, r.time);
}
function persistNextFire(id, fireAt) {
  saveRems(getRems().map(function(x){ return x.id == id ? Object.assign({}, x, { nextFire: fireAt }) : x; }));
}
function cancelRem(id) {
  swPost({ type:'CANCEL', id:id });
  lsDel('lf_' + id);   // drop the "already handled" marker
  syncCancelToServer(id);
}
function scheduleEvent(ev, announce) {
  if (!ev.time) return; // no time set → note only, no alarm
  var fireAt = eventFireAt(ev);
  if (fireAt === null) return;
  if (Date.now() - fireAt > MISSED_WINDOW_MS) return; // long past, don't resurrect
  var msg = { type:'SCHEDULE', id:ev.id, title:ev.title, note:ev.note, time:ev.time,
              fireAt:fireAt, repeat:'once', days:null,
              snooze:getSettings().snooze };
  if (announce) msg.confirmLabel = ev.title + ' — ' + fmtDateLabel(ev.date) + ' u ' + fmtTime(ev.time);
  swPost(msg);
  syncScheduleToServer(ev.id, ev.title, ev.note, fireAt, 'once', null, ev.time);
}
function eventFireAt(ev) {
  if (!ev.time || !ev.date) return null;
  var p = ev.time.split(':'), d = ev.date.split('-').map(Number);
  if (d.length !== 3) return null;
  return new Date(d[0], d[1]-1, d[2], +p[0], +p[1], 0, 0).getTime();
}

// ── Audio + haptics ───────────────────────────────────────────────────────
var audioCtx = null, alarmTimer = null;
function playBeep() {
  try {
    if (!audioCtx || audioCtx.state === 'closed')
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var t = audioCtx.currentTime;
    [880, 1320, 880, 1320, 440].forEach(function(f, i) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i*.18);
      g.gain.linearRampToValueAtTime(.18, t + i*.18 + .04);
      g.gain.linearRampToValueAtTime(0, t + i*.18 + .15);
      o.start(t + i*.18); o.stop(t + i*.18 + .22);
    });
  } catch(e) {}
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch(e) {}
}
function startAlarm() {
  stopAlarm(); // guard: a second alarm must not orphan the previous interval
  playBeep();
  alarmTimer = setInterval(playBeep, 1400);
}
function stopAlarm() {
  if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
  try { if (navigator.vibrate) navigator.vibrate(0); } catch(e) {}
}

// ── Alarm trigger ─────────────────────────────────────────────────────────
// One shared "this id already went off" marker for both paths that can ring an
// alarm (the service worker's timer and the in-page fallback loop below), so
// whichever gets there first wins and the other backs off.
function markHandled(id) { lsSet('lf_' + id, Date.now()); }
function handledRecently(id) { return Date.now() - (lsGet('lf_' + id, 0) || 0) < 60000; }

// Moves a reminder/event past the occurrence that just fired: 'once' items are
// done, repeating ones get their next slot computed the same way the SW does.
function advanceOnFire(id) {
  var rems = getRems(), hit = false;
  var updated = rems.map(function(r) {
    if (r.id != id) return r;
    hit = true;
    if (r.repeat === 'once') return Object.assign({}, r, { fired:true, nextFire:null });
    return Object.assign({}, r, { nextFire: computeNextFire(r.time, r.repeat, r.days, Date.now()) });
  });
  if (hit) { saveRems(updated); return; }
  var evs = getEvents();
  var hitEv = false;
  var updatedEvs = evs.map(function(e) {
    if (e.id != id) return e;
    hitEv = true;
    return Object.assign({}, e, { fired:true });
  });
  if (hitEv) saveEvents(updatedEvs);
}

function triggerAlarm(data) {
  if (handledRecently(data.id)) return;
  markHandled(data.id);

  var rems = getRems(), r = rems.filter(function(x){ return x.id == data.id; })[0];
  var evs = getEvents(), ev = evs.filter(function(x){ return x.id == data.id; })[0];
  advanceOnFire(data.id);

  enqueueAlarm({
    id: data.id,
    title: data.title || (r && r.title) || (ev && ev.title) || 'Podsjetnik',
    note: data.note || (r && r.note) || (ev && ev.note) || '',
    late: !!data.late
  });
}

function enqueueAlarm(a) {
  if (APP.alarm && APP.alarm.id == a.id) return;
  if (APP.alarmQueue.some(function(x){ return x.id == a.id; })) return;
  APP.alarmQueue.push(a);
  // With one already on screen the new one just waits, but the "N still
  // waiting" line has to repaint or it silently under-reports the queue.
  if (APP.alarm) render();
  else presentAlarm();
}
// Two reasons not to show an alarm right now: the app is backgrounded (the OS
// notification is already up — hijacking the screen the moment the user opens
// something else is worse than waiting), or another alarm is on screen. Both
// just leave it queued.
function presentAlarm() {
  if (document.hidden || APP.alarm || !APP.alarmQueue.length) return;
  APP.alarm = APP.alarmQueue.shift();
  startAlarm();
  render();
}
function finishAlarm() {
  stopAlarm();
  APP.alarm = null;
  APP.pinInput = '';
  APP.perr = '';
  presentAlarm();
  if (!APP.alarm) render();
}

document.addEventListener('visibilitychange', function(){
  if (document.hidden) return;
  refreshNotifPerm();
  swPost({ type:'SYNC' });   // let the SW catch up on anything the OS slept through
  presentAlarm();
});

// ── Page fallback loop ────────────────────────────────────────────────────
// Last line of defence: if the service worker was killed and its timer never
// ran, an open page still notices the moment it passes nextFire.
setInterval(function() {
  var now = Date.now();
  getRems().forEach(function(r) {
    if (r.fired || !r.nextFire || now < r.nextFire) return;
    if (now - r.nextFire > MISSED_WINDOW_MS) { advanceOnFire(r.id); return; }
    triggerAlarm({ id:r.id, title:r.title, note:r.note || '', late: now - r.nextFire > 90000 });
  });
  getEvents().forEach(function(ev) {
    if (ev.fired || !ev.time) return;
    var at = eventFireAt(ev);
    if (at === null || now < at || now - at > MISSED_WINDOW_MS) return;
    triggerAlarm({ id:ev.id, title:ev.title, note:ev.note || '', late: now - at > 90000 });
  });
}, 15000);

// ── Formatting helpers ────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }
function fmtTime(t) { var p=t.split(':'); return pad(p[0])+':'+p[1]; }
var DAY_SHORT = ['Ned','Pon','Uto','Sri','Čet','Pet','Sub'];
function rl(repeat, days) {
  if (repeat === 'once') return 'jednom';
  if (repeat === 'daily') return 'svaki dan';
  if (repeat === 'weekdays') return 'radni dani';
  if (repeat === 'custom') {
    var d = (days || []).slice().sort(function(a,b){ return ((a+6)%7) - ((b+6)%7); });
    return d.length ? d.map(function(x){ return DAY_SHORT[x]; }).join(', ') : 'nijedan dan';
  }
  return repeat;
}
// "za 3 h 20 min" reads better than a bare timestamp for the next occurrence.
function fmtCountdown(ms) {
  if (ms <= 0) return 'sada';
  var mins = Math.round(ms / 60000);
  if (mins < 60) return 'za ' + mins + ' min';
  var hrs = Math.floor(mins / 60), rem = mins % 60;
  if (hrs < 24) return 'za ' + hrs + ' h' + (rem ? ' ' + rem + ' min' : '');
  var days = Math.floor(hrs / 24);
  return 'za ' + days + (days === 1 ? ' dan' : ' dana');
}

// ── Date helpers (calendar) ───────────────────────────────────────────────
var MONTHS = ['Januar','Februar','Mart','April','Maj','Juni','Juli','August','Septembar','Oktobar','Novembar','Decembar'];
var DOWS = ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'];
function dkey(y,m,d) { return y+'-'+pad(m+1)+'-'+pad(d); }
function todayKey() { var n=new Date(); return dkey(n.getFullYear(), n.getMonth(), n.getDate()); }
function fmtDateLabel(k) {
  var p = k.split('-').map(Number);
  return p[2] + '. ' + MONTHS[p[1]-1].toLowerCase() + ' ' + p[0] + '.';
}

// ── DOM helpers ───────────────────────────────────────────────────────────
function mk(tag, attrs, children) {
  var el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      var v = attrs[k];
      if (v == null) return;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.substr(0,2) === 'on') el.addEventListener(k.substr(2), v);
      else if (k === 'disabled') { if (v) el.disabled = true; }
      else if (k === 'value' && (tag==='input'||tag==='select')) el.setAttribute('value', v);
      else el.setAttribute(k, v);
    });
  }
  if (children) {
    children.forEach(function(c) {
      if (c == null || c === false) return;
      if (typeof c === 'string') el.appendChild(document.createTextNode(c));
      else el.appendChild(c);
    });
  }
  return el;
}
function svgEl(path, size, col) {
  var s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width', size||20); s.setAttribute('height', size||20);
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');
  s.setAttribute('stroke', col||'currentColor'); s.setAttribute('stroke-width','2');
  s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
  s.innerHTML = path; return s;
}
function label(t) { var l = mk('label'); l.textContent = t; return l; }
function textEl(tag, cls, t, style) {
  var e = mk(tag, { class: cls || null, style: style || null });
  e.textContent = t;
  return e;
}
function sel(val, opts) {
  var s = mk('select', { class:'inp' });
  opts.forEach(function(o) {
    var opt = document.createElement('option');
    opt.value = o[0]; opt.textContent = o[1];
    if (o[0] === val) opt.selected = true;
    s.appendChild(opt);
  });
  return s;
}
function emptyState(icon, msg) {
  var e = mk('div',{class:'empty'});
  e.appendChild(textEl('div','empty-icon', icon));
  e.appendChild(textEl('p', null, msg));
  return e;
}

  for (var i=0;i<total;i++) wrap.appendChild(mk('div',{class:'dot'+(i<filled?' on':'')}));
  return wrap;
}
function renderPinPad(onDigit, onDel) {
  var keys = ['1','2','3','4','5','6','7','8','9','','0','DEL'];
  var pad = mk('div',{class:'pin-pad'});
  keys.forEach(function(k) {
    if (k==='') { pad.appendChild(mk('div',{class:'pkey pkey-empty'})); return; }
    var btn = mk('button',{class:'pkey'+(k==='DEL'?' pkey-del':'')});
    btn.textContent = k==='DEL'?'⌫':k;
    btn.addEventListener('click', function(){ k==='DEL'?onDel():onDigit(k); });
    pad.appendChild(btn);
  });
