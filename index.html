// ── Setup view ────────────────────────────────────────────────────────────
function renderSetup() {
  var isC = APP.setupStep === 'confirm';
  var cur = isC ? APP.sc : APP.sp;

  function onDigit(d) {
    if (cur.length >= 6) return;
    if (isC) APP.sc += d; else APP.sp += d;
    APP.serr = '';
    render();
  }
  function onDel() {
    if (isC) APP.sc = APP.sc.slice(0,-1); else APP.sp = APP.sp.slice(0,-1);
    APP.serr = '';
    render();
  }
  function onNext() {
    if (!isC) {
      if (APP.sp.length < 4) { APP.serr = 'Minimum 4 broja'; render(); return; }
      APP.setupStep = 'confirm'; APP.serr = ''; render();
    } else {
      if (APP.sc !== APP.sp) { APP.sc=''; APP.serr='PIN-ovi se ne podudaraju!'; render(); }
      else {
        lsSet('app_pin', APP.sp); APP.pin=APP.sp;
        APP.sp=''; APP.sc=''; APP.setupStep='set'; APP.serr=''; APP.view='main';
        toast('PIN sačuvan ✓');
        render();
      }
    }
  }

  var wrap = mk('div',{class:'page-center'});
  var inner = mk('div',{style:'width:100%;max-width:310px'});
  inner.appendChild(appHeader('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    (APP.view==='setup' && APP.pin) ? 'PROMJENA PIN-A' : 'POSTAVLJANJE PIN-A'));

  inner.appendChild(textEl('div',null, isC ? 'Potvrdi PIN' : 'Postavi PIN', 'font-size:24px;font-weight:800;margin-bottom:8px'));
  inner.appendChild(textEl('div',null,
    isC ? 'Ponovi isti PIN za potvrdu.' : 'Ovaj PIN koristit ćeš za gašenje alarma. Min 4, max 6 brojeva.',
    'font-size:14px;color:var(--text-dim);margin-bottom:30px;line-height:1.65'));

  inner.appendChild(renderPinDots(cur.length));
  inner.appendChild(textEl('div','err', APP.serr || ' '));
  inner.appendChild(renderPinPad(onDigit, onDel));

  var btnWrap = mk('div',{style:'margin-top:18px'});
  var btn = mk('button',{class:'btn-red',disabled:cur.length<4});
  btn.textContent = isC ? 'Spremi PIN' : 'Nastavi →';
  btn.addEventListener('click', onNext);
  btnWrap.appendChild(btn);

  if (APP.pin && APP.view === 'setup') {
    var cancel = mk('button',{class:'btn-ghost'});
    cancel.textContent = 'Odustani';
    cancel.addEventListener('click', function(){ APP.view='main'; APP.sp=''; APP.sc=''; APP.serr=''; render(); });
    btnWrap.appendChild(cancel);
  }
  inner.appendChild(btnWrap);
  wrap.appendChild(inner);
  return wrap;
}

// ── Alarm view ────────────────────────────────────────────────────────────
function renderAlarm() {
  var now = new Date();
  var a = APP.alarm;

  function onDigit(d) { if(APP.pinInput.length<6){ APP.pinInput+=d; APP.perr=''; render(); } }
  function onDel() { APP.pinInput=APP.pinInput.slice(0,-1); APP.perr=''; render(); }
  function tryDismiss() {
    if (APP.pinInput === APP.pin) {
      swPost({ type:'DISMISS', id:a.id });
      finishAlarm();
    } else {
      APP.pinInput=''; APP.perr='Pogrešan PIN!'; render();
      try { if (navigator.vibrate) navigator.vibrate(200); } catch(e) {}
      var p = document.querySelector('.pin-pad');
      if(p){ p.style.animation='shake .4s ease'; setTimeout(function(){p.style.animation='';},500); }
    }
  }
  function doSnooze() {
    var mins = getSettings().snooze;
    swPost({ type:'SNOOZE', id:a.id, minutes:mins });
    lsDel('lf_' + a.id);   // it will legitimately ring again — clear the guard
    finishAlarm();
    toast('Odgođeno ' + mins + ' min');
  }

  var page = mk('div',{class:'alarm-page'});
  var ring = mk('div',{class:'alarm-ring'});
  ring.appendChild(svgEl('<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',36,'var(--accent)'));
  page.appendChild(ring);

  page.appendChild(textEl('div',null, pad(now.getHours())+':'+pad(now.getMinutes()),
    'font-size:13px;color:var(--accent);letter-spacing:2px;margin-bottom:10px'));
  if (a.late) {
    page.appendChild(textEl('div','alarm-badge','⏰ Zakasnio alarm — sistem je ugasio app u pozadini pa nije zazvonio na vrijeme'));
  }
  page.appendChild(textEl('div',null,a.title,'font-size:26px;font-weight:800;text-align:center;margin-bottom:8px'));
  if (a.note) page.appendChild(textEl('div',null,a.note,'font-size:14px;color:var(--text-dim);text-align:center;margin-bottom:28px;line-height:1.5'));

  page.appendChild(textEl('div',null,'Unesi PIN za gašenje alarma','font-size:13px;color:var(--text-dim);margin-bottom:22px'));
  page.appendChild(renderPinDots(APP.pinInput.length));
  page.appendChild(textEl('div','err', APP.perr || ' '));
  page.appendChild(renderPinPad(onDigit, onDel));

  var btnWrap = mk('div',{style:'margin-top:18px;width:100%;max-width:290px'});
  var btn = mk('button',{class:'btn-red',disabled:APP.pinInput.length<4});
  btn.textContent='Potvrdi PIN';
  btn.addEventListener('click', tryDismiss);
  btnWrap.appendChild(btn);

  // Snooze doesn't weaken the PIN lock — it postpones the same alarm, it can't
  // silence it. Without the PIN there is still no way to make it stop for good.
  var snz = mk('button',{class:'btn-ghost'});
  snz.textContent = 'Odgodi ' + getSettings().snooze + ' min';
  snz.addEventListener('click', doSnooze);
  btnWrap.appendChild(snz);
  page.appendChild(btnWrap);

  if (APP.alarmQueue.length) {
    page.appendChild(textEl('div','alarm-queue','Još ' + APP.alarmQueue.length + ' alarm(a) čeka'));
  }
  return page;
}

// ── Add / edit tab ────────────────────────────────────────────────────────
function renderAddTab(page) {
  var editing = APP.editId !== null;
  var card = mk('div',{class:'card'});
  card.appendChild(textEl('div','card-title', editing ? 'Uredi podsjetnik' : 'Novi podsjetnik'));

  function valid() { return !!APP.addTitle.trim() && !!APP.addTime &&
    (APP.addRepeat !== 'custom' || APP.addDays.length > 0); }
  function sync() { addBtn.disabled = !valid(); }

  var f1 = mk('div',{class:'field'});
  f1.appendChild(label('Naziv *'));
  var inp1 = mk('input',{type:'text',placeholder:'npr. Popij lijek, Sastanak...'});
  inp1.value = APP.addTitle;
  inp1.addEventListener('input', function(){ APP.addTitle=this.value; sync(); });
  f1.appendChild(inp1); card.appendChild(f1);

  var f2 = mk('div',{class:'field'});
  f2.appendChild(label('Napomena'));
  var inp2 = mk('input',{type:'text',placeholder:'Detalji...'});
  inp2.value = APP.addNote;
  inp2.addEventListener('input', function(){ APP.addNote=this.value; });
  f2.appendChild(inp2); card.appendChild(f2);

  var row = mk('div',{class:'row2'});
  var f3 = mk('div',{class:'field'});
  f3.appendChild(label('Vrijeme *'));
  var inp3 = mk('input',{type:'time'}); inp3.value = APP.addTime;
  inp3.addEventListener('input', function(){ APP.addTime=this.value; sync(); });
  f3.appendChild(inp3); row.appendChild(f3);

  var f4 = mk('div',{class:'field'});
  f4.appendChild(label('Ponavljanje'));
  var selEl = sel(APP.addRepeat, [['once','Jednom'],['daily','Svaki dan'],['weekdays','Radni dani'],['custom','Odaberi dane']]);
  selEl.addEventListener('change', function(){ APP.addRepeat=this.value; render(); });
  f4.appendChild(selEl); row.appendChild(f4);
  card.appendChild(row);

  if (APP.addRepeat === 'custom') {
    var dp = mk('div',{class:'daypick'});
    [['Pon',1],['Uto',2],['Sri',3],['Čet',4],['Pet',5],['Sub',6],['Ned',0]].forEach(function(p){
      var b = mk('button',{class:'daypick-btn'+(APP.addDays.indexOf(p[1])!==-1?' on':''),type:'button'});
      b.textContent = p[0];
      // Mutates APP.addDays and repaints only this button — a full render()
      // here would tear down the title/note inputs mid-typing.
      b.addEventListener('click', function(){
        var i = APP.addDays.indexOf(p[1]);
        if (i === -1) APP.addDays.push(p[1]); else APP.addDays.splice(i,1);
        b.className = 'daypick-btn'+(APP.addDays.indexOf(p[1])!==-1?' on':'');
        sync();
      });
      dp.appendChild(b);
    });
    card.appendChild(dp);
  }

  var addBtn = mk('button',{class:'btn-red'});
  addBtn.textContent = editing ? 'Sačuvaj izmjene' : 'Postavi podsjetnik';
  addBtn.disabled = !valid();
  addBtn.addEventListener('click', function(){
    if (!valid()) return;
    var days = APP.addRepeat === 'custom' ? APP.addDays.slice() : null;
    if (editing) {
      var existing = getRems().filter(function(x){ return x.id == APP.editId; })[0];
      if (!existing) { resetAddForm(); render(); return; }
      cancelRem(existing.id);
      var upd = Object.assign({}, existing, {
        title: APP.addTitle.trim(), note: APP.addNote.trim(), time: APP.addTime,
        repeat: APP.addRepeat, days: days, fired: false,
        nextFire: computeNextFire(APP.addTime, APP.addRepeat, days, Date.now())
      });
      saveRems(getRems().map(function(x){ return x.id == upd.id ? upd : x; }));
      scheduleRem(upd);
      toast('Izmjene sačuvane ✓');
    } else {
      var r = {
        id: Date.now(), title: APP.addTitle.trim(), note: APP.addNote.trim(),
        time: APP.addTime, repeat: APP.addRepeat, days: days, fired: false,
        nextFire: computeNextFire(APP.addTime, APP.addRepeat, days, Date.now())
      };
      saveRems(getRems().concat([r]));
      scheduleRem(r, true);
      toast('Podsjetnik postavljen ✓');
    }
    resetAddForm();
    APP.tab = 'list';
    render();
  });
  card.appendChild(addBtn);

  if (editing) {
    var cancelBtn = mk('button',{class:'btn-ghost'});
    cancelBtn.textContent = 'Odustani';
    cancelBtn.addEventListener('click', function(){ resetAddForm(); APP.tab='list'; render(); });
    card.appendChild(cancelBtn);
  }
  page.appendChild(card);

  if (!editing && APP.addTime && valid()) {
    var preview = computeNextFire(APP.addTime, APP.addRepeat, APP.addRepeat==='custom'?APP.addDays:null, Date.now());
    page.appendChild(textEl('div',null,'Prvi put zvoni ' + fmtCountdown(preview - Date.now()) + '.',
      'font-size:12px;color:var(--text-faint);text-align:center;padding:2px 0 8px'));
  }
}
function resetAddForm() {
  APP.addTitle=''; APP.addNote=''; APP.addTime=''; APP.addRepeat='daily';
  APP.addDays=[1,2,3,4,5]; APP.editId=null;
}
function startEditRem(r) {
  APP.editId = r.id;
  APP.addTitle = r.title; APP.addNote = r.note || ''; APP.addTime = r.time;
  APP.addRepeat = r.repeat; APP.addDays = (r.days && r.days.length) ? r.days.slice() : [1,2,3,4,5];
  APP.tab = 'add';
  render();
}

// ── List tab ──────────────────────────────────────────────────────────────
function renderListTab(page) {
  var rems = getRems();
  if (rems.length === 0) {
    page.appendChild(emptyState('○','Nema podsjetnika. Dodaj ih u tabu Dodaj.'));
    return;
  }

  if (rems.length > 4) {
    var searchWrap = mk('div',{style:'margin-bottom:12px'});
    var s = mk('input',{class:'inp',type:'search',placeholder:'Traži podsjetnik...'});
    s.value = APP.listQuery;
    // Filters in place instead of re-rendering, so the keyboard and caret stay put.
    s.addEventListener('input', function(){
      APP.listQuery = this.value;
      var q = this.value.trim().toLowerCase();
      Array.prototype.forEach.call(page.querySelectorAll('[data-search]'), function(el){
        el.style.display = (!q || el.getAttribute('data-search').indexOf(q) !== -1) ? '' : 'none';
      });
    });
    searchWrap.appendChild(s);
    page.appendChild(searchWrap);
  }

  var active = rems.filter(function(r){ return !r.fired; });
  var done = rems.filter(function(r){ return r.fired; });
  var now = Date.now();

  function row(r) {
    var ri = mk('div',{class:'ri','data-search':(r.title+' '+(r.note||'')).toLowerCase()});
    var tap = mk('div',{class:'ri-tap'});
    tap.appendChild(mk('div',{class:'ri-dot'+(r.fired?' done':'')}));
    var rb = mk('div',{class:'ri-body'});
    rb.appendChild(textEl('div','ri-name'+(r.fired?' done':''), r.title));
    rb.appendChild(textEl('div','ri-meta', fmtTime(r.time)+' · '+rl(r.repeat, r.days)+(r.fired?' · ✓ odzvonio':'')));
    if (r.note) rb.appendChild(textEl('div','ri-note', r.note));
    if (!r.fired && r.nextFire) rb.appendChild(textEl('div','ri-next','Zvoni ' + fmtCountdown(r.nextFire - now)));
    tap.appendChild(rb);
    tap.addEventListener('click', function(){ startEditRem(r); });
    ri.appendChild(tap);

    var del = mk('button',{class:'ri-del'}); del.textContent='×';
    del.addEventListener('click', function(){
      cancelRem(r.id);
      saveRems(getRems().filter(function(x){ return x.id !== r.id; }));
      toast('Obrisano');
      render();
    });
    ri.appendChild(del);
    return ri;
  }

  active.slice().sort(function(a,b){ return (a.nextFire||0) - (b.nextFire||0); }).forEach(function(r){ page.appendChild(row(r)); });

  if (done.length) {
    var head = mk('div',{style:'display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px'});
    head.appendChild(textEl('div','cal-events-title','Odzvonili', 'margin:0'));
    var clr = mk('button',{style:'font-size:12px;color:var(--accent);font-weight:700;background:none;border:none;cursor:pointer'});
    clr.textContent = 'Očisti (' + done.length + ')';
    clr.addEventListener('click', function(){
      done.forEach(function(r){ cancelRem(r.id); });
      saveRems(getRems().filter(function(x){ return !x.fired; }));
      toast('Očišćeno');
      render();
    });
    head.appendChild(clr);
    page.appendChild(head);
    done.forEach(function(r){ page.appendChild(row(r)); });
  }
}

// ── Notes tab ─────────────────────────────────────────────────────────────
function renderNotesTab(page) {
  var cats = getCats();
  var openCat = APP.notesCat ? cats.filter(function(c){ return c.id===APP.notesCat; })[0] : null;

  if (!openCat) {
    var addRow = mk('div',{class:'add-inline'});
    var catInp = mk('input',{type:'text',placeholder:'npr. More, Kamp, Posao...'});
    catInp.value = APP.newCatName;
    catInp.addEventListener('input', function(){ APP.newCatName=this.value; addCatBtn.disabled=!APP.newCatName.trim(); });
    catInp.addEventListener('keydown', function(e){ if (e.key==='Enter') addCatBtn.click(); });
    addRow.appendChild(catInp);
    var addCatBtn = mk('button',{disabled:!APP.newCatName.trim()});
    addCatBtn.textContent='+';
    addCatBtn.addEventListener('click', function(){
      var name = APP.newCatName.trim();
      if (!name) return;
      saveCats(getCats().concat([{id:Date.now(),name:name,items:[]}]));
      APP.newCatName='';
      render();
    });
    addRow.appendChild(addCatBtn);
    page.appendChild(addRow);

    if (cats.length === 0) {
      page.appendChild(emptyState('☰','Nema kategorija. Dodaj prvu iznad (npr. More).'));
      return;
    }
    var grid = mk('div',{class:'cat-grid'});
    cats.forEach(function(c) {
      var card = mk('div',{class:'cat-card'});
      card.appendChild(textEl('div','cat-card-name', c.name));
      var doneN = c.items.filter(function(i){return i.done;}).length;
      card.appendChild(textEl('div','cat-card-count', c.items.length===0 ? 'Prazno' : (doneN+' / '+c.items.length)));
      if (c.items.length) {
        var bar = mk('div',{class:'cat-bar'});
        bar.appendChild(mk('span',{style:'width:'+Math.round(doneN/c.items.length*100)+'%'}));
        card.appendChild(bar);
      }
      var del = mk('button',{class:'cat-card-del'}); del.textContent='×';
      del.addEventListener('click', function(e){
        e.stopPropagation();
        if (!confirm('Obrisati kategoriju "'+c.name+'"?')) return;
        saveCats(getCats().filter(function(x){return x.id!==c.id;}));
        render();
      });
      card.appendChild(del);
      card.addEventListener('click', function(){ APP.notesCat=c.id; render(); });
      grid.appendChild(card);
    });
    page.appendChild(grid);
    return;
  }

  var back = mk('button',{class:'cat-back'}); back.textContent='← Sve kategorije';
  back.addEventListener('click', function(){ APP.notesCat=null; render(); });
  page.appendChild(back);
  page.appendChild(textEl('div','card-title', openCat.name));

  function mutateCat(fn) {
    var all = getCats();
    var target = all.filter(function(c){ return c.id===openCat.id; })[0];
    if (target) fn(target);
    saveCats(all);
    render();
  }

  var itemAddRow = mk('div',{class:'add-inline'});
  var itemInp = mk('input',{type:'text',placeholder:'Dodaj stvar...'});
  itemInp.value = APP.newItemText;
  itemInp.addEventListener('input', function(){ APP.newItemText=this.value; addItemBtn.disabled=!APP.newItemText.trim(); });
  itemInp.addEventListener('keydown', function(e){ if (e.key==='Enter') addItemBtn.click(); });
  itemAddRow.appendChild(itemInp);
  var addItemBtn = mk('button',{disabled:!APP.newItemText.trim()});
  addItemBtn.textContent='+';
  addItemBtn.addEventListener('click', function(){
    var text = APP.newItemText.trim();
    if (!text) return;
    APP.newItemText='';
    mutateCat(function(t){ t.items = t.items.concat([{id:Date.now(),text:text,done:false}]); });
  });
  itemAddRow.appendChild(addItemBtn);
  page.appendChild(itemAddRow);

  if (openCat.items.length === 0) {
    page.appendChild(emptyState('○','Nema stvari u ovoj kategoriji.'));
    return;
  }
  openCat.items.forEach(function(it) {
    var row = mk('div',{class:'cat-item'});
    var chk = mk('button',{class:'cat-item-check'+(it.done?' done':'')});
    if (it.done) chk.appendChild(svgEl('<polyline points="20 6 9 17 4 12"/>',13,'var(--accent-ink)'));
    chk.addEventListener('click', function(){
      mutateCat(function(t){ t.items = t.items.map(function(i){ return i.id===it.id ? Object.assign({},i,{done:!i.done}) : i; }); });
    });
    row.appendChild(chk);
    row.appendChild(textEl('div','cat-item-text'+(it.done?' done':''), it.text));
    var idel = mk('button',{class:'ri-del'}); idel.textContent='×';
    idel.addEventListener('click', function(){
      mutateCat(function(t){ t.items = t.items.filter(function(i){ return i.id!==it.id; }); });
    });
    row.appendChild(idel);
    page.appendChild(row);
  });
}

// ── Calendar tab ──────────────────────────────────────────────────────────
function renderCalendarTab(page) {
  var events = getEvents();
  var y = APP.calYear, m = APP.calMonthIdx;

  var nav = mk('div',{class:'cal-nav'});
  var prevBtn = mk('button'); prevBtn.textContent='‹';
  prevBtn.addEventListener('click', function(){ var mm=m-1, yy=y; if(mm<0){mm=11;yy--;} APP.calMonthIdx=mm; APP.calYear=yy; render(); });
  nav.appendChild(prevBtn);
  nav.appendChild(textEl('div','cal-nav-label', MONTHS[m]+' '+y));
  var nextBtn = mk('button'); nextBtn.textContent='›';
  nextBtn.addEventListener('click', function(){ var mm=m+1, yy=y; if(mm>11){mm=0;yy++;} APP.calMonthIdx=mm; APP.calYear=yy; render(); });
  nav.appendChild(nextBtn);
  page.appendChild(nav);

  var grid = mk('div',{class:'cal-grid'});
  DOWS.forEach(function(d){ grid.appendChild(textEl('div','cal-dow', d)); });

  var startOffset = (new Date(y, m, 1).getDay()+6)%7; // Monday=0
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var daysInPrevMonth = new Date(y, m, 0).getDate();
  var tKey = todayKey();

  var evByDate = {};
  events.forEach(function(ev){ (evByDate[ev.date] = evByDate[ev.date] || []).push(ev); });

  var cells = [];
  for (var i=0;i<startOffset;i++) cells.push({d:daysInPrevMonth-startOffset+i+1, other:true, key:null});
  for (var d=1; d<=daysInMonth; d++) cells.push({d:d, other:false, key:dkey(y,m,d)});
  while (cells.length % 7 !== 0) cells.push({d:cells.length-(startOffset+daysInMonth)+1, other:true, key:null});

  cells.forEach(function(c) {
    var cEl = mk('div',{class:'cal-day'+(c.other?' other':'')+(c.key===tKey?' today':'')+(c.key===APP.calSelDate?' selected':'')});
    cEl.appendChild(textEl('div', null, String(c.d)));
    if (c.key && evByDate[c.key] && evByDate[c.key].length>0) cEl.appendChild(mk('div',{class:'cal-day-dot'}));
    if (!c.other) cEl.addEventListener('click', function(){ APP.calSelDate=c.key; APP.calEditId=null; render(); });
    grid.appendChild(cEl);
  });
  page.appendChild(grid);

  var editingEv = APP.calEditId !== null;
  var evCard = mk('div',{class:'card'});
  evCard.appendChild(textEl('div','card-title',
    editingEv ? 'Uredi zadatak' : (APP.calSelDate ? fmtDateLabel(APP.calSelDate) : 'Odaberi datum')));

  var evF1 = mk('div',{class:'field'});
  evF1.appendChild(label('Naziv *'));
  var evInp1 = mk('input',{type:'text',placeholder:'Šta trebaš uraditi...'});
  evInp1.value = APP.calAddTitle;
  evInp1.addEventListener('input', function(){ APP.calAddTitle=this.value; evAddBtn.disabled=!APP.calAddTitle.trim(); });
  evF1.appendChild(evInp1); evCard.appendChild(evF1);

  var evRow = mk('div',{class:'row2'});
  var evF2 = mk('div',{class:'field'});
  evF2.appendChild(label('Vrijeme'));
  var evInp2 = mk('input',{type:'time'}); evInp2.value=APP.calAddTime;
  evInp2.addEventListener('input', function(){ APP.calAddTime=this.value; });
  evF2.appendChild(evInp2); evRow.appendChild(evF2);

  var evF3 = mk('div',{class:'field'});
  evF3.appendChild(label('Napomena'));
  var evInp3 = mk('input',{type:'text',placeholder:'Detalji...'});
  evInp3.value = APP.calAddNote;
  evInp3.addEventListener('input', function(){ APP.calAddNote=this.value; });
  evF3.appendChild(evInp3); evRow.appendChild(evF3);
  evCard.appendChild(evRow);

  evCard.appendChild(textEl('div','field-hint','Postavi vrijeme da zadatak zazvoni kao alarm (traži PIN za gašenje).'));

  var evAddBtn = mk('button',{class:'btn-red',disabled:!APP.calAddTitle.trim()});
  evAddBtn.textContent = editingEv ? 'Sačuvaj izmjene' : 'Dodaj u kalendar';
  evAddBtn.addEventListener('click', function(){
    if (!APP.calAddTitle.trim() || !APP.calSelDate) return;
    if (editingEv) {
      var old = getEvents().filter(function(x){ return x.id === APP.calEditId; })[0];
      if (old) {
        cancelRem(old.id);
        var upd = Object.assign({}, old, {
          date: APP.calSelDate, time: APP.calAddTime,
          title: APP.calAddTitle.trim(), note: APP.calAddNote.trim(), fired: false
        });
        saveEvents(getEvents().map(function(x){ return x.id === upd.id ? upd : x; }));
        scheduleEvent(upd);
        toast('Izmjene sačuvane ✓');
      }
    } else {
      var ev = {id:'ev'+Date.now(), date:APP.calSelDate, time:APP.calAddTime,
                title:APP.calAddTitle.trim(), note:APP.calAddNote.trim(), fired:false};
      saveEvents(getEvents().concat([ev]));
      scheduleEvent(ev, true);
      toast(ev.time ? 'Zadatak dodan — zvoni u ' + fmtTime(ev.time) : 'Zadatak dodan');
    }
    APP.calAddTitle=''; APP.calAddTime=''; APP.calAddNote=''; APP.calEditId=null;
    render();
  });
  evCard.appendChild(evAddBtn);

  if (editingEv) {
    var evCancel = mk('button',{class:'btn-ghost'});
    evCancel.textContent = 'Odustani';
    evCancel.addEventListener('click', function(){
      APP.calAddTitle=''; APP.calAddTime=''; APP.calAddNote=''; APP.calEditId=null; render();
    });
    evCard.appendChild(evCancel);
  }
  page.appendChild(evCard);

  var dayEvents = (evByDate[APP.calSelDate] || []).slice().sort(function(a,b){
    return (a.time||'99:99').localeCompare(b.time||'99:99');
  });
  page.appendChild(textEl('div','cal-events-title','Zadaci za ovaj dan'));
  if (dayEvents.length === 0) {
    page.appendChild(emptyState('○','Nema zadataka za ovaj dan.'));
    return;
  }
  dayEvents.forEach(function(ev) {
    var ri = mk('div',{class:'ri'});
    var tap = mk('div',{class:'ri-tap'});
    if (ev.time) tap.appendChild(textEl('div','ev-time', fmtTime(ev.time)));
    else tap.appendChild(mk('div',{class:'ri-dot'+(ev.fired?' done':'')}));
    var rb = mk('div',{class:'ri-body'});
    rb.appendChild(textEl('div','ri-name'+(ev.fired?' done':''), ev.title));
    var bits = [];
    if (ev.time) bits.push('🔔 alarm');
    if (ev.fired) bits.push('✓ odzvonio');
    if (bits.length) rb.appendChild(textEl('div','ri-meta', bits.join(' · ')));
    if (ev.note) rb.appendChild(textEl('div','ri-note', ev.note));
    tap.appendChild(rb);
    tap.addEventListener('click', function(){
      APP.calEditId = ev.id; APP.calSelDate = ev.date;
      APP.calAddTitle = ev.title; APP.calAddTime = ev.time || ''; APP.calAddNote = ev.note || '';
      render();
    });
    ri.appendChild(tap);
    var del = mk('button',{class:'ri-del'}); del.textContent='×';
    del.addEventListener('click', function(){
      cancelRem(ev.id);
      saveEvents(getEvents().filter(function(x){ return x.id!==ev.id; }));
      if (APP.calEditId === ev.id) { APP.calEditId=null; APP.calAddTitle=''; APP.calAddTime=''; APP.calAddNote=''; }
      toast('Obrisano');
      render();
    });
    ri.appendChild(del);
    page.appendChild(ri);
  });
}

// ── Backup ────────────────────────────────────────────────────────────────
function exportBackup() {
  var data = {
    kind: 'pin-podsjetnik-backup', version: APP_VERSION,
    exportedAt: new Date().toISOString(),
    app_pin: lsGet('app_pin',''),
    reminders: getRems(), note_categories: getCats(),
    cal_events: getEvents(), settings: getSettings()
  };
  try {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = mk('a',{href:url,download:'podsjetnik-'+todayKey()+'.json'});
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast('Kopija spremljena ✓');
  } catch(e) { toast('Spremanje nije uspjelo'); }
}
function importBackup(file) {
  var fr = new FileReader();
  fr.onload = function() {
    var d;
    try { d = JSON.parse(fr.result); } catch(e) { toast('Datoteka nije ispravna'); return; }
    if (!d || typeof d !== 'object' ||
        (!Array.isArray(d.reminders) && !Array.isArray(d.cal_events) && !Array.isArray(d.note_categories))) {
      toast('Ovo nije kopija ove aplikacije');
      return;
    }
    if (!confirm('Zamijeniti sve trenutne podatke podacima iz kopije?')) return;
    swPost({ type:'CANCEL_ALL' });
    if (Array.isArray(d.reminders)) saveRems(d.reminders);
    if (Array.isArray(d.note_categories)) saveCats(d.note_categories);
    if (Array.isArray(d.cal_events)) saveEvents(d.cal_events);
    if (d.settings) saveSettings(d.settings);
    if (d.app_pin) lsSet('app_pin', d.app_pin);
    toast('Kopija uvezena ✓');
    setTimeout(function(){ location.reload(); }, 800);
  };
  fr.onerror = function(){ toast('Čitanje datoteke nije uspjelo'); };
  fr.readAsText(file);
}

// ── Settings tab ──────────────────────────────────────────────────────────
function settingsRow(title, sub, control) {
  var row = mk('div',{class:'srow'});
  var left = mk('div');
  left.appendChild(textEl('div','srow-label', title));
  if (sub) left.appendChild(textEl('div','srow-sub', sub));
  row.appendChild(left);
  if (control) row.appendChild(control);
  return row;
}
function segControl(options, current, onPick) {
  var seg = mk('div',{class:'seg'});
  options.forEach(function(o){
    var b = mk('button',{class: o[0] === current ? 'on' : ''});
    b.textContent = o[1];
    b.addEventListener('click', function(){ onPick(o[0]); });
    seg.appendChild(b);
  });
  return seg;
}

function renderSettingsTab(page) {
  var st = getSettings();

  // Security
  var sc = mk('div',{class:'card'});
  sc.appendChild(textEl('div','card-title','Sigurnost'));
  var pinBtn = mk('button'); pinBtn.textContent='Promijeni';
  pinBtn.addEventListener('click', function(){ APP.setupStep='set'; APP.sp=''; APP.sc=''; APP.serr=''; APP.view='setup'; render(); });
  sc.appendChild(settingsRow('PIN kod', '●'.repeat(Math.max(4, APP.pin.length)), pinBtn));

  var delBtn = mk('button'); delBtn.textContent='Obriši';
  delBtn.addEventListener('click', function(){
    if (!confirm('Obrisati SVE podatke (PIN, podsjetnike, bilješke, kalendar)?')) return;
    if (!confirm('Sigurno? Ovo se ne može poništiti. Napravi kopiju prije brisanja.')) return;
    swPost({type:'CANCEL_ALL'}); syncCancelAllToServer(); lsClear(); location.reload();
  });
  sc.appendChild(settingsRow('Obriši sve', 'Briše PIN, podsjetnike, bilješke i kalendar', delBtn));
  page.appendChild(sc);

  // Appearance & behaviour
  var pc = mk('div',{class:'card'});
  pc.appendChild(textEl('div','card-title','Izgled i ponašanje'));
  pc.appendChild(settingsRow('Tema', null, segControl(
    [['auto','Auto'],['light','Svijetla'],['dark','Tamna']], st.theme,
    function(v){ var s=getSettings(); s.theme=v; saveSettings(s); applyTheme(); render(); }
  )));
  pc.appendChild(settingsRow('Odgoda alarma', 'Koliko "Odgodi" pomjera alarm', segControl(
    [[5,'5'],[10,'10'],[15,'15'],[30,'30 min']], st.snooze,
    function(v){ var s=getSettings(); s.snooze=v; saveSettings(s); render(); }
  )));
  page.appendChild(pc);

  // Notifications
  var nc = mk('div',{class:'card'});
  nc.appendChild(textEl('div','card-title','Notifikacije'));
  var statusText =
    APP.notifPerm==='granted' ? 'Dozvoljeno ✓' :
    APP.notifPerm==='denied'  ? 'Blokirano' :
    APP.notifPerm==='unsupported' ? (notifNeedsInstall() ? 'Dostupno tek nakon instalacije na početni ekran' : 'Preglednik ne podržava') :
                                'Nije postavljeno';
  var allowBtn = null;
  if (APP.notifPerm==='default' || APP.notifPerm==='unsupported') {
    allowBtn = mk('button'); allowBtn.textContent='Dozvoli';
    allowBtn.addEventListener('click', requestNotifPerm);
  }
  nc.appendChild(settingsRow('Status', statusText, allowBtn));

  if (APP.notifPerm === 'granted') {
    var testBtn = mk('button'); testBtn.textContent='Pokreni';
    testBtn.addEventListener('click', function(){
      swPost({ type:'TEST', seconds:15 });
      toast('Test alarm za 15 sekundi — zatvori app da provjeriš pozadinu');
    });
    nc.appendChild(settingsRow('Test alarma', 'Zazvoni za 15 sekundi — provjeri radi li i kad je app zatvoren', testBtn));
  }

  // Blocked can only be undone outside the app — show exactly where.
  if (APP.notifPerm === 'denied') {
    var how = mk('div',{style:'padding-top:12px'});
    how.appendChild(textEl('div',null,'Kako odblokirati:','font-size:12px;color:var(--text);font-weight:700;margin-bottom:8px'));
    notifUnblockSteps().forEach(function(step, i) {
      how.appendChild(textEl('div',null,(i+1)+'. '+step,'font-size:12px;color:var(--text-dim);line-height:1.65;margin-bottom:4px'));
    });
    var recheck = mk('button',{style:'margin-top:10px;font-size:13px;color:var(--accent);font-weight:700;background:none;border:1px solid var(--border);border-radius:8px;padding:9px 14px;cursor:pointer'});
    recheck.textContent = 'Provjeri ponovo';
    recheck.addEventListener('click', function(){
      var before = APP.notifPerm;
      refreshNotifPerm();
      if (Notification.permission === before) {
        APP.notifMsg = 'I dalje blokirano. Provjeri korake iznad pa dodirni ponovo.';
        render();
      }
    });
    how.appendChild(recheck);
    nc.appendChild(how);
  }
  if (APP.notifMsg) nc.appendChild(textEl('div',null,APP.notifMsg,'font-size:12px;color:var(--text-dim);line-height:1.6;padding-top:10px'));
  page.appendChild(nc);

  // Backup
  var bc = mk('div',{class:'card'});
  bc.appendChild(textEl('div','card-title','Sigurnosna kopija'));
  bc.appendChild(textEl('div',null,
    'Podaci žive samo na ovom uređaju. Brisanje podataka preglednika ili gubitak telefona znači gubitak svega — spremi kopiju s vremena na vrijeme.',
    'font-size:12px;color:var(--text-faint);line-height:1.7;margin-bottom:6px'));
  var expBtn = mk('button'); expBtn.textContent='Izvezi';
  expBtn.addEventListener('click', exportBackup);
  bc.appendChild(settingsRow('Izvezi kopiju', 'Sprema .json datoteku na uređaj', expBtn));

  var fileInp = mk('input',{type:'file',accept:'application/json,.json',style:'display:none'});
  fileInp.addEventListener('change', function(){ if (this.files && this.files[0]) importBackup(this.files[0]); });
  var impBtn = mk('button'); impBtn.textContent='Uvezi';
  impBtn.addEventListener('click', function(){ fileInp.click(); });
  bc.appendChild(settingsRow('Uvezi kopiju', 'Zamjenjuje sve trenutne podatke', impBtn));
  bc.appendChild(fileInp);
  page.appendChild(bc);

  // Reliability
  var rc = mk('div',{class:'card'});
  rc.appendChild(textEl('div','card-title','Pouzdanost alarma'));
  rc.appendChild(textEl('div',null,
    'Android može ugasiti app u pozadini, pa alarm ne zazvoni tačno na vrijeme — u tom slučaju zazvoni kao "zakasnio" čim se app probudi. Za najpouzdaniji rad:',
    'font-size:12px;color:var(--text-faint);line-height:1.7;margin-bottom:10px'));
  ['Isključi optimizaciju baterije za ovu app (Settings → Apps → Battery → Bez ograničenja)',
   'Uključi Autostart za ovu app (Settings → Apps → Autostart)',
   'Zaključaj app u pregledu nedavnih (Recents) — dugi pritisak na karticu → Lock',
   'Instaliraj app na početni ekran umjesto da je koristiš u tabu preglednika'
  ].forEach(function(step) {
    rc.appendChild(textEl('div',null,'• '+step,'font-size:12px;color:var(--text-faint);line-height:1.7;margin-bottom:3px'));
  });
  page.appendChild(rc);

  // About
  var vc = mk('div',{class:'card'});
  vc.appendChild(textEl('div','card-title','O aplikaciji'));
  var vb = mk('button');
  vb.textContent = APP.swUpdateAvailable ? 'Osvježi' : 'Provjeri';
  vb.addEventListener('click', function(){
    if (APP.swUpdateAvailable) { applySWUpdate(); return; }
    if (!APP.swReg) return;
    vb.textContent = '...';
    APP.swReg.update().then(function(){
      if (!APP.swUpdateAvailable) { vb.textContent = 'Ažurno ✓'; setTimeout(function(){ vb.textContent='Provjeri'; }, 2000); }
    }).catch(function(){ vb.textContent = 'Provjeri'; });
  });
  vc.appendChild(settingsRow('Verzija',
    APP.swUpdateAvailable ? APP_VERSION + ' (učitana) — nova je dostupna' : APP_VERSION, vb));
  vc.appendChild(settingsRow('Push server', PUSH_SERVER_URL ? 'Povezan ✓' : 'Nije postavljen (lokalni alarmi)', null));
  page.appendChild(vc);
}

// ── Main view ─────────────────────────────────────────────────────────────
function renderMain() {
  var rems = getRems();
  var active = rems.filter(function(r){ return !r.fired; });
  var page = mk('div',{class:'page'});
  page.appendChild(appHeader('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>','● AKTIVAN'));

  // One-tap prompt only while permission can still be granted from here. A
  // blocked permission cannot be re-requested by script, so nothing is shown
  // at the top for it — the full status and instructions live under ⚙.
  if (APP.notifPerm === 'default' && !APP.notifAsked) {
    var bn = mk('div',{class:'banner banner-warn'});
    bn.appendChild(textEl('p',null,'⚠ Dozvoli notifikacije za rad u pozadini.'));
    var bb = mk('button'); bb.textContent='Dozvoli';
    bb.addEventListener('click', requestNotifPerm);
    bn.appendChild(bb);
    var bx = mk('button',{style:'background:transparent;color:var(--text);opacity:.5;padding:6px 8px'});
    bx.textContent='×';
    bx.addEventListener('click', function(){ markNotifAsked(); render(); });
    bn.appendChild(bx);
    page.appendChild(bn);
  }

  var tabsEl = mk('div',{class:'tabs'});
  [['add','Dodaj'],['list','Lista'],['notes','Bilješke'],['calendar','Kalendar'],['settings','⚙']].forEach(function(pair){
    var t = mk('button',{class:'tab'+(APP.tab===pair[0]?' active':'')});
    t.textContent = pair[1];
    if (pair[0]==='list' && active.length>0) {
      var badge = mk('span',{class:'tab-badge'}); badge.textContent=String(active.length); t.appendChild(badge);
    }
    t.addEventListener('click', function(){
      if (APP.tab === 'add' && pair[0] !== 'add') resetAddForm();
      APP.tab=pair[0];
      render();
    });
    tabsEl.appendChild(t);
  });
  page.appendChild(tabsEl);

  if (APP.tab === 'add') renderAddTab(page);
  if (APP.tab === 'list') renderListTab(page);
  if (APP.tab === 'notes') renderNotesTab(page);
  if (APP.tab === 'calendar') renderCalendarTab(page);
  if (APP.tab === 'settings') renderSettingsTab(page);

  if (APP.installPrompt && !APP.installDismissed) {
    var ib = mk('div',{class:'install-bar'});
    var iico = mk('div',{class:'install-bar-icon'});
    iico.appendChild(mk('img',{src:'icon-192.png',alt:''}));
    ib.appendChild(iico);
    var itxt = mk('div',{class:'install-bar-text'});
    itxt.appendChild(textEl('strong',null,'Instaliraj aplikaciju'));
    itxt.appendChild(textEl('span',null,'Dodaj na početni ekran'));
    ib.appendChild(itxt);
    var ibtn = mk('button',{class:'install-bar-btn'}); ibtn.textContent='Instaliraj';
    ibtn.addEventListener('click', function(){
      var p = APP.installPrompt;
      if (!p) return;
      p.prompt();
      p.userChoice.then(function(r){
        APP.installPrompt = null;
        if (r.outcome !== 'accepted') { APP.installDismissed = true; lsSet('install_dismissed', true); }
        render();
      });
    });
    ib.appendChild(ibtn);
    var iclose = mk('button',{class:'install-bar-close'}); iclose.textContent='×';
    iclose.addEventListener('click', function(){ APP.installDismissed=true; lsSet('install_dismissed',true); render(); });
    ib.appendChild(iclose);
    page.appendChild(ib);
    page.style.paddingBottom = 'calc(100px + env(safe-area-inset-bottom))';
  }

  return page;
}

// ── Main render ───────────────────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  app.innerHTML = '';
  var view;
  if (APP.alarm) view = renderAlarm();
  else if (!APP.pin || APP.view === 'setup') view = renderSetup();
  else view = renderMain();
  app.appendChild(view);
}

// ── Init ──────────────────────────────────────────────────────────────────
applyTheme();
APP.pin = lsGet('app_pin','');
APP.installDismissed = !!lsGet('install_dismissed', false);
APP.notifAsked = !!lsGet('notif_asked', false);
APP.calSelDate = todayKey();
initSW();
if (('Notification' in window) && Notification.permission === 'granted') subscribeToPush();

// Re-arm everything with the service worker on every load. Cheap, idempotent,
// and the only thing that recovers a schedule the OS wiped along with the SW.
getRems().filter(function(r){ return !r.fired; }).forEach(function(r){ scheduleRem(r); });
getEvents().filter(function(e){ return !e.fired; }).forEach(function(e){ scheduleEvent(e); });

// Handle URL parameters from notification click or shortcut
(function() {
  var params = new URLSearchParams(location.search);
  var alarmParam = params.get('alarm');
  var actionParam = params.get('action');
  if (alarmParam) {
    try {
      var d = JSON.parse(decodeURIComponent(alarmParam));
      // The SW already rang this one and set the guard, so triggerAlarm would
      // bail out — go straight to the queue to show the PIN screen.
      if (d && d.type === 'ALARM') {
        setTimeout(function() {
          enqueueAlarm({ id:d.id, title:d.title || 'Podsjetnik', note:d.note || '', late:!!d.late });
        }, 300);
      }
    } catch(e) {}
    history.replaceState(null, '', location.pathname);
  } else if (actionParam && APP.pin) {
    var tabs = { add:'add', calendar:'calendar', notes:'notes' };
    if (tabs[actionParam]) APP.tab = tabs[actionParam];
    history.replaceState(null, '', location.pathname);
  }
})();

render(); // immediate, synchronous, no dependencies
</script>
